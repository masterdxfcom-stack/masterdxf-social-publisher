name: Test Select Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run select-content script
        run: node scripts/select-content.js

      - name: Commit updated tracker and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/design-tracker.json data/latest-output.json
          git commit -m "Update design tracker and latest output" || echo "No changes to commit"
          git push
